databases:
  - name: kericho-tea-db
    plan: free
    databaseName: teafarm
    user: teafarm

services:
  - type: web
    name: CHAIYAKO
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn run:app"
    domains:
      - factory.chaiyako.site
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kericho-tea-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
