<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set your password — Kericho Tea Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="flash-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
</div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>🔐 Set up your account</h1>
    <p class="subtitle">Your factory has registered you. Enter the code sent to your phone to set your own password.</p>
    <form method="POST">
      <div>
        <label>Phone number</label>
        <input type="text" name="phone" value="{{ phone }}" required placeholder="07XX XXX XXX">
      </div>
      <div>
        <label>Verification code</label>
        <input type="text" name="code" required placeholder="6-digit code">
      </div>
      <div>
        <label>New password</label>
        <input type="password" name="password" required minlength="6">
      </div>
      <div>
        <label>Confirm password</label>
        <input type="password" name="confirm_password" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" style="justify-content:center;">Set password & log in</button>
    </form>
    <div class="auth-foot">Already set your password? <a href="{{ url_for('auth.login') }}">Log in</a></div>
  </div>
</div>
</body>
</html>
