<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ title }} — {{ factory_name }}</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: #fff; color: #111827; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 360px; }
  .factory { font-size: 0.85rem; color: #6b7280; margin-bottom: 10px; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 10px; }
  p { color: #4b5563; line-height: 1.5; margin: 0 0 22px; }
  a { display: inline-block; padding: 12px 20px; border-radius: 10px; background: #111827; color: #fff; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
  <main>
    <div class="factory">{{ factory_name }}</div>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if current_user.is_authenticated %}<a href="{{ url_for('work.home') }}">Back to My work</a>
    {% else %}<a href="{{ url_for('auth.login') }}">Go to login</a>{% endif %}
  </main>
</body>
</html>
