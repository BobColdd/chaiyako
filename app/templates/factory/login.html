<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Factory Staff Login — Chai Yako Tea Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="flash-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
</div>
<div class="auth-wrap" style="background: radial-gradient(circle at 20% 20%, #c9a227, #3a2e05 65%);">
  <div class="auth-card">
    <h1>🏭 Factory Staff Login</h1>
    <p class="subtitle">Who's logging in?</p>
    <div style="display:flex; flex-direction:column; gap:12px; margin-top:8px;">
      <a href="{{ url_for('factory_auth.manager_login') }}" class="btn btn-gold" style="justify-content:center;">🧑‍💼 Manager</a>
      <a href="{{ url_for('factory_auth.clerk_login') }}" class="btn btn-outline" style="justify-content:center; color:#fff; border-color: rgba(255,255,255,0.6);">⚖️ Clerk / Tallyboy</a>
    </div>
    <div class="auth-foot"><a href="{{ url_for('main.landing') }}">← Back to main site</a></div>
  </div>
</div>
</body>
</html>
