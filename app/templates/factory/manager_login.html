<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manager Login — Chai Yako Tea Factory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="flash-wrap">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
</div>
<div class="auth-wrap" style="background: radial-gradient(circle at 20% 20%, #c9a227, #3a2e05 65%);">
  <div class="auth-card">
    <h1>🧑‍💼 Manager Login</h1>
    <p class="subtitle">Factory managers only.</p>
    <form method="POST">
      <div>
        <label>Username</label>
        <input type="text" name="username" required autofocus>
      </div>
      <div>
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-gold" style="justify-content:center;">Log in</button>
    </form>
    <div class="auth-foot"><a href="{{ url_for('factory_auth.login') }}">← Not a manager?</a></div>
  </div>
</div>
</body>
</html>
